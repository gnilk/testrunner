name: Build

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # Linux build: produces the two Debian component packages (testrunner + testrunner-dev).
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt install -y liblldb-dev

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Smoke test (load a real shared library and list its exported tests)
      working-directory: ${{github.workspace}}/build
      # The project registers no CTest tests; this exercises the loader/nm export scan and exits 0.
      # A full self-run is not used as a gate: the suite intentionally fails 15 self-tests (non-zero).
      run: ./trun -lx lib/libtrun_utests.so

    - name: Package (.deb)
      run: cmake --build ${{github.workspace}}/build --target package

    - name: Create Release and Upload .deb
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{github.workspace}}/build/*.deb

  build-windows:
    # Windows build: tcov is skipped (no debug-engine backend yet); produces the NSIS
    # installer (testrunner-<version>-win64.exe) with the runtime + dev components.
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install NSIS (CPack installer generator)
      # NSIS is not reliably pre-installed on the runner image; installing it ourselves keeps
      # the packaging step deterministic and puts makensis on PATH for CPack to find.
      run: choco install nsis -y --no-progress

    - name: Configure CMake
      # Default generator on the runner is the Visual Studio multi-config generator; MSVC is
      # already present. tcov auto-disables on WIN32 (needs an SEH/DbgHelp backend that does
      # not exist yet), so liblldb is not required here.
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Smoke test (load a real DLL and list its exported tests)
      working-directory: ${{github.workspace}}/build
      # Exercises the Windows-specific PE-export-parsing load path and exits 0. A full self-run
      # is not used as a gate: the suite intentionally fails 15 self-tests and so returns non-zero.
      run: ./trun.exe -lx trun_utests.dll

    - name: Package (NSIS installer)
      working-directory: ${{github.workspace}}/build
      run: cpack -G NSIS -C ${{env.BUILD_TYPE}}

    - name: Create Release and Upload installer
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{github.workspace}}/build/testrunner-*.exe
