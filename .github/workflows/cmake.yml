name: Build

on:
  push:
    # master + tags publish (see the package/upload steps and the release job).
    # dev is CI-only: it builds Linux + Windows and smoke-tests, but produces no
    # packages/artifacts/release - the maintainer works on macOS, so this is where
    # Linux/Windows breakage gets caught.
    branches: [ master, dev ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master, dev ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # Linux build: produces the two Debian component packages (testrunner + testrunner-dev)
    # and uploads them as a workflow artifact (consumed by the release job on tag builds).
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt install -y liblldb-dev

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Smoke test (load a real shared library and list its exported tests)
      working-directory: ${{github.workspace}}/build
      # The project registers no CTest tests; this exercises the loader/nm export scan and exits 0.
      # A full self-run is not used as a gate: the suite intentionally fails 15 self-tests (non-zero).
      run: ./trun -lx lib/libtrun_utests.so

    # Packaging + artifact upload only where a package is actually consumed: master
    # pushes (grabbable by beta testers) and tag pushes (fed to the release job). On
    # dev pushes and on any PR the job stops after the smoke test - build validation only.
    - name: Package (.deb)
      if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
      run: cmake --build ${{github.workspace}}/build --target package

    - name: Upload .deb artifact
      if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: deb-package
        path: ${{github.workspace}}/build/*.deb
        if-no-files-found: error

  build-windows:
    # Windows build: tcov is skipped (no debug-engine backend yet); produces the NSIS installer
    # (testrunner-<version>-win64.exe) and uploads it as a workflow artifact for the release job.
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install NSIS (CPack installer generator)
      # NSIS is not reliably pre-installed on the runner image; installing it ourselves keeps
      # the packaging step deterministic and puts makensis on PATH for CPack to find.
      run: choco install nsis -y --no-progress

    - name: Configure CMake
      # Default generator on the runner is the Visual Studio multi-config generator; MSVC is
      # already present. tcov auto-disables on WIN32 (needs an SEH/DbgHelp backend that does
      # not exist yet), so liblldb is not required here.
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Smoke test (load a real DLL and list its exported tests)
      working-directory: ${{github.workspace}}/build
      # Exercises the Windows-specific PE-export-parsing load path and exits 0. A full self-run
      # is not used as a gate: the suite intentionally fails 15 self-tests and so returns non-zero.
      run: ./trun.exe -lx trun_utests.dll

    # Packaging + upload gated as in the Linux job: master/tags only, dev + PRs build-only.
    - name: Package (NSIS installer)
      if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
      working-directory: ${{github.workspace}}/build
      run: cpack -G NSIS -C ${{env.BUILD_TYPE}}

    - name: Upload installer artifact
      if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: ${{github.workspace}}/build/testrunner-*.exe
        if-no-files-found: error

  release:
    # Single publisher: only after BOTH platform builds succeed, and only on tag pushes.
    # One writer to the GitHub Release avoids the create-release race two parallel jobs would
    # hit, and a broken build on either platform blocks the release instead of shipping half of it.
    needs: [build, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Create Release and upload packages
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/**/*.deb
          dist/**/testrunner-*.exe
        fail_on_unmatched_files: true
